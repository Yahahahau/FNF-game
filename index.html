<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>FNF Arrow Playground</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Four note lanes: left, down, up, right. Keys: arrows or A S W D" role="application"></canvas>

    <div id="status" role="status">LOADING…</div>
    <div id="judge" aria-hidden="true"></div>

    <div id="controls" hidden>
      <button id="sfx-toggle" type="button" aria-pressed="true">ARROW SFX: ON</button>
      <label class="vol">
        <span>VOL</span>
        <input id="sfx-volume" type="range" min="0" max="100" step="1" value="80" aria-label="Arrow SFX volume" />
      </label>
      <label class="vol">
        <span>SPEED</span>
        <input id="scroll-speed" type="range" min="5" max="50" step="1" value="20" aria-label="Scroll speed" />
        <output id="speed-out">2.0</output>
      </label>
      <button id="demo-pause" type="button" aria-pressed="false">PAUSE DEMO</button>
      <button id="demo-restart" type="button">RESTART</button>
    </div>

    <p id="legal">Fan-made prototype with original placeholder sprites &mdash; not affiliated with The Funkin' Crew Inc.</p>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
